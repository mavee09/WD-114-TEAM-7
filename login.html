<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Registration | Academic Review System</title>
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-tabs">
            <button class="tab-btn active" id="tab-register">Register</button>
            <button class="tab-btn" id="tab-student">Student Login</button>
            <button class="tab-btn" id="tab-admin">Admin Login</button>
        </div>

        <form id="register-form" class="auth-form" action="home.html">
            <h2>Create Account</h2>
            <p>Please upload credentials for verification</p>
            
            <div class="input-group">
                <label>Username / Email</label>
                <input type="text" placeholder="Enter your username" required>
            </div>

            <div class="input-group">
                <label>Upload Certificate of Registration (COR)</label>
                <div class="file-upload">
                    <input type="file" required>
                </div>
            </div>

            <div class="input-group">
                <label>Upload School ID</label>
                <div class="file-upload">
                    <input type="file" required>
                </div>
            </div>

            <button type="submit" class="submit-btn">Verify & Register</button>
        </form>

        <form id="student-form" class="auth-form hidden" action="home.html">
            <h2>Student Login</h2>
            <p>Welcome back! Please enter your details.</p>
            
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" placeholder="student@school.edu" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="submit-btn">Login to Dashboard</button>
        </form>

        <form id="admin-form" class="auth-form hidden" action="admin.html">
            <h2>Admin Portal</h2>
            <p>Authorized access only.</p>
            
            <div class="input-group">
                <label>Admin ID</label>
                <input type="text" placeholder="Enter Admin ID" required>
            </div>

            <div class="input-group">
                <label>Security Key</label>
                <input type="password" placeholder="Enter Security Key" required>
            </div>

            <button type="submit" class="submit-btn admin-btn">Access System</button>
        </form>

        <footer class="auth-footer">
            Academic Subject Review System © 2026
        </footer>
    </div>

    <script src="../assets/js/login.js"></script>
</body>
</html>
